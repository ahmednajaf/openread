name: Checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Unit checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run site:build
      - run: node dev/scripts/build-apple-extension.cjs
      - run: git diff --exit-code -- app/apple/SafariExtension/Resources/
      - run: git diff --exit-code -- extension/ app/reader/dist/
      - name: Install context-model test runtime
        run: python -m pip install numpy==2.2.6 onnxruntime==1.24.2
      - run: npm test
