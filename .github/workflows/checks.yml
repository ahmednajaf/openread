name: Checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Unit checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run site:build
      - run: node dev/scripts/build-apple-extension.cjs
      - run: git diff --exit-code -- app/apple/SafariExtension/Resources/
      - run: git diff --exit-code -- extension/ app/reader/dist/
      - run: npm test
      - name: Build portable Qwen CPU engine
        run: cmake -S app/mobile/shared/qwen -B /tmp/openread-qwen -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/openread-qwen --parallel 2
