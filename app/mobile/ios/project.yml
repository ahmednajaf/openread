name: OpenRead
options:
  bundleIdPrefix: dev.openread
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  KittenSDK:
    url: https://github.com/KittenML/KittenTTS-swift
    revision: 20cd4d8784c1bad348326955709892c8dfe7226b
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.7.6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    OPENREAD_BUNDLE_ID: dev.openread.mobile
    OPENREAD_APP_GROUP: group.dev.openread.mobile
targets:
  OpenRead: &ReaderTarget
    type: application
    platform: iOS
    sources:
      - OpenRead
      - ../shared/swift
      - path: ../shared/models.json
        buildPhase: resources
      - path: ../shared/NOTICES.txt
        buildPhase: resources
      - path: ../shared/odyssey.json
        buildPhase: resources
    dependencies:
      - package: KittenSDK
        product: KittenTTS
      - package: SwiftSoup
      - package: ZIPFoundation
      - target: OpenReadShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID)"
        INFOPLIST_FILE: OpenRead/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenRead/OpenRead.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  OpenReadPersonal:
    <<: *ReaderTarget
    dependencies:
      - package: KittenSDK
        product: KittenTTS
      - package: SwiftSoup
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID).personal"
        INFOPLIST_FILE: OpenRead/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENREAD_PERSONAL"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  OpenReadShare:
    type: app-extension
    platform: iOS
    sources:
      - OpenReadShare
      - ../shared/swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID).share"
        INFOPLIST_FILE: OpenReadShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenReadShare/OpenReadShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OpenReadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenReadTests
      - path: ../shared/fixtures
        buildPhase: resources
    dependencies:
      - target: OpenRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenRead:
    build:
      targets:
        OpenRead: all
    test:
      targets: [OpenReadTests]
  OpenReadPersonal:
    build:
      targets:
        OpenReadPersonal: all
