name: OpenRead
options:
  bundleIdPrefix: dev.openread
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  OpenReadKitten2:
    path: ../shared/kitten2
  OpenReadInference:
    path: ../shared/inference
  OpenReadSpeech:
    path: ../shared/speech
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.7.6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 19
    MARKETING_VERSION: 0.6.7
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    OPENREAD_BUNDLE_ID: dev.openread.mobile
    OPENREAD_APP_GROUP: group.dev.openread.mobile
targets:
  OpenRead: &ReaderTarget
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    type: application
    platform: iOS
    sources:
      - OpenRead
      - ../shared/swift
      - path: ../shared/pronunciation
        type: folder
        buildPhase: resources
      - path: ../shared/speech/espeak-ng-data
        type: folder
        buildPhase: resources
      - path: ../shared/models.json
        buildPhase: resources
      - path: ../shared/kitten2-voices.json
        buildPhase: resources
      - path: ../../../extension/voices.json
        buildPhase: resources
      - path: ../shared/kokoro-vocab.json
        buildPhase: resources
      - path: ../shared/NOTICES.txt
        buildPhase: resources
      - path: ../shared/odyssey.json
        buildPhase: resources
    dependencies:
      - package: OpenReadKitten2
      - package: OpenReadInference
      - package: OpenReadSpeech
      - package: ONNXRuntime
        product: onnxruntime
      - package: SwiftSoup
      - package: ZIPFoundation
      - target: OpenReadShare
      - target: OpenReadSafari
    postBuildScripts:
      - name: Align embedded ONNX framework minimum iOS version
        script: sh "$SRCROOT/../../../dev/scripts/fix-apple-framework.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework/_CodeSignature/CodeResources"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID)"
        INFOPLIST_FILE: OpenRead/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenRead/OpenRead.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  OpenReadPersonal:
    <<: *ReaderTarget
    dependencies:
      - package: OpenReadKitten2
      - package: OpenReadInference
      - package: OpenReadSpeech
      - package: ONNXRuntime
        product: onnxruntime
      - package: SwiftSoup
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID).personal"
        INFOPLIST_FILE: OpenRead/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENREAD_PERSONAL"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  OpenReadShare:
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    type: app-extension
    platform: iOS
    sources:
      - OpenReadShare
      - ../shared/swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID).share"
        INFOPLIST_FILE: OpenReadShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenReadShare/OpenReadShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OpenReadSafari:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - ../../apple/SafariExtension/SafariWebExtensionHandler.swift
      - ../../apple/SafariExtension/PrivacyInfo.xcprivacy
      - OpenRead/VoiceEngine.swift
      - OpenRead/SafariListeningSession.swift
      - OpenRead/ContextPronunciation.swift
      - OpenRead/KittenInference.swift
      - OpenRead/LibraryStore.swift
      - ../shared/swift
      - path: ../shared/models.json
        buildPhase: resources
      - path: ../shared/kitten2-voices.json
        buildPhase: resources
      - path: ../../../extension/voices.json
        buildPhase: resources
      - path: ../shared/kokoro-vocab.json
        buildPhase: resources
      - path: ../shared/pronunciation
        type: folder
        buildPhase: resources
      - path: ../shared/speech/espeak-ng-data
        type: folder
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/background.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/core.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/extract.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/player.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/highlighter.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/content.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/popup.html
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/popup.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/settings.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/glass.js
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/popup.css
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/reader.css
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/manifest.json
        buildPhase: resources
      - path: ../../apple/SafariExtension/Resources/icons
        type: folder
        buildPhase: resources
    dependencies:
      - package: OpenReadInference
      - package: OpenReadSpeech
      - package: ONNXRuntime
        product: onnxruntime
      - package: ZIPFoundation
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENREAD_SAFARI"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENREAD_BUNDLE_ID).safari"
        INFOPLIST_FILE: ../../apple/SafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../apple/SafariExtension/Native.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OpenReadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenReadTests
      - path: ../../../extension/player.js
        buildPhase: resources
      - path: ../shared/fixtures
        buildPhase: resources
    dependencies:
      - target: OpenRead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenRead:
    build:
      targets:
        OpenRead: all
    test:
      targets: [OpenReadTests]
  OpenReadPersonal:
    build:
      targets:
        OpenReadPersonal: all
